name: Deploy AKASHI Generative Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract website package
        run: |
          test -f AKASHI_GENERATIVE_LAB_GitHub_Pages.zip
          mkdir -p release
          unzip -q AKASHI_GENERATIVE_LAB_GitHub_Pages.zip -d release
          test -f release/AKASHI_GENERATIVE_LAB/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/AKASHI_GENERATIVE_LAB

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
