name: Deploy AKASHI GENERATIVE LAB to GitHub Pages
# Deploys the uploaded AKASHI_GENERATIVE_LAB package to the configured Pages site.

on:
  push:
    branches: [main]
    paths:
      - "AKASHI_GENERATIVE_LAB_GitHub_Pages.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Extract website package
        run: |
          test -f AKASHI_GENERATIVE_LAB_GitHub_Pages.zip
          mkdir -p release
          unzip -q AKASHI_GENERATIVE_LAB_GitHub_Pages.zip -d release
          test -f release/AKASHI_GENERATIVE_LAB/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/AKASHI_GENERATIVE_LAB

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
